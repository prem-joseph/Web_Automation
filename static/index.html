<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub - Web Test Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css"> </head>
<body class="bg-gray-900 text-gray-200">
    <div class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-white">Project Hub</h1>
            <div class="flex gap-4">
                 <a href="/runner" id="test-runner-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2">
                    <i class="fas fa-play-circle"></i>
                    <span>Test Runner</span>
                </a>
                <a href="/settings" id="settings-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <button id="new-project-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span>New Project</span>
                </button>
            </div>
        </div>
        <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>

    <div id="mode-modal" class="modal hidden">
         <h2 class="text-2xl font-bold mb-6 text-center">Choose Recording Mode</h2>
         <div id="mode-modal-content" class="flex flex-col gap-4">
            </div>
         <div class="modal-actions">
            <button id="mode-close-btn" class="modal-button-secondary">Cancel</button>
         </div>
    </div>

    <div id="import-modal" class="modal hidden">
        <h2 class="text-2xl font-bold mb-1">Import from TestRail</h2>
        <p class="text-gray-400 mb-4">Import cases into <strong id="import-project-name" class="text-white"></strong></p>
        <div class="space-y-4">
            <div>
                <label for="import-tr-project" class="block text-sm font-medium text-gray-300">1. Select TestRail Project</label>
                <select id="import-tr-project" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-purple-500 focus:border-purple-500"></select>
            </div>
            <div id="suite-selector-div" class="hidden">
                <label for="import-tr-suite" class="block text-sm font-medium text-gray-300">2. Select Test Suite</label>
                <select id="import-tr-suite" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-purple-500 focus:border-purple-500"></select>
            </div>
        </div>
        <div class="modal-actions">
            <button id="import-cancel-btn" class="modal-button-secondary">Cancel</button>
            <button id="import-confirm-btn" class="modal-button-primary disabled:opacity-50" disabled>Import</button>
        </div>
    </div>
    
    <div id="prompt-modal" class="modal hidden">
        <h3 id="prompt-title" class="text-lg font-bold mb-4"></h3>
        <input id="prompt-input" type="text" class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-purple-500 focus:border-purple-500">
        <div class="modal-actions">
            <button id="prompt-cancel-btn" class="modal-button-secondary">Cancel</button>
            <button id="prompt-confirm-btn" class="modal-button-primary">Confirm</button>
        </div>
    </div>
     <div id="confirm-modal" class="modal hidden">
        <h3 id="confirm-title" class="text-lg font-bold mb-2">Are you sure?</h3>
        <p id="confirm-message" class="text-gray-400 mb-4"></p>
        <div class="modal-actions">
            <button id="confirm-cancel-btn" class="modal-button-secondary">Cancel</button>
            <button id="confirm-ok-btn" class="modal-button-danger">Confirm</button>
        </div>
    </div>


    <script src="/static/index.js"></script>
</body>
</html>

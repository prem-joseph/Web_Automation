<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Playback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-900 text-gray-200">
    <div class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-white">Test Playback</h1>
            <a id="back-to-designer-link" href="#" class="text-purple-400 hover:text-purple-300">
                <i class="fas fa-arrow-left mr-2"></i>Back to Designer
            </a>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">Execution Log</h2>
            <div id="log-container" class="h-full bg-gray-900 p-4 rounded-md overflow-y-auto font-mono text-sm" style="height: 32rem;">
                <p class="text-gray-500">Waiting to start test run...</p>
            </div>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="/static/playback.js"></script>
</body>
</html>
